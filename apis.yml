aid: descript
name: Descript
description: >-
  Descript is an AI-powered video and audio editing platform. Descript's API lets you programmatically create projects,
  import media, run AI ("Underlord") edits, publish compositions, and export transcripts — all without opening the
  desktop app. The API surfaces the same job model that backs the desktop editor and is currently in early access.
