            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
              examples:
                unauthorized:
                  summary: Missing authentication token
                  value:
                    error: unauthorized
                    message: Missing or invalid authentication token
        '403':
          description: 'Forbidden:

            - User doesn''t have write access to the project

            - Project doesn''t belong to the token''s drive

            - Requested `access_level` is not permitted by the drive''s publish settings

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
              examples:
                forbidden:
                  summary: No access to project
                  value:
                    error: forbidden
                    message: Forbidden
        '422':
          description: 'Unprocessable Entity

            '
        '429':
          $ref: '#/components/responses/Error429Response'
  /jobs:
    get:
      tags:
      - API Endpoints
      summary: List jobs
      description: 'List recent jobs with optional filtering by project or job type.


        By default, jobs created within the last 7 days are returned. Use `created_after` and

        `created_before` to customize the time range. The maximum lookback is 30 days.


        Results are paginated. Use the `cursor` from the response `pagination.next_cursor` to

        fetch subsequent pages.


        Query parameters allow you to filter the results:

        * Filter by `project_id` to see all jobs for a project

        * Filter by `type` to see specific job types (import/project_media, agent)

        '
      operationId: listJobs
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: project_id
        description: Filter by project ID
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: type
        description: Filter by job type
        required: false
        schema:
          type: string
          enum:
          - import/project_media
          - agent
      - in: query
        name: cursor
        description: Cursor for the next page of results, obtained from `pagination.next_cursor` in a previous response
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: Number of items per page (1-100). Defaults to 20.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - in: query
        name: created_after
        description: 'Filter jobs created after this timestamp (ISO 8601). Default: 7 days ago. Oldest allowed: 30 days ago.'
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        description: 'Filter jobs created before this timestamp (ISO 8601). Default: now.'
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Jobs list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobStatus'
                  pagination:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        description: Cursor for the next page of results. Absent if no more results.
              examples:
                mixed_jobs:
                  summary: List of jobs with different types and states
                  value:
                    data:
                    - job_id: 6dc3f30a-58c2-4174-96a6-dc18cf3c7776
                      job_type: import/project_media
                      job_state: stopped
                      created_at: '2025-11-18T10:30:00Z'
                      stopped_at: '2025-11-18T10:35:00Z'
                      drive_id: c9c5c47e-158a-49f7-846b-4f6ee2a229a2
                      project_id: 9f36ee32-5a2c-47e7-b1a3-94991d3e3ddb
                      project_url: https://web.descript.com/9f36ee32-5a2c-47e7-b1a3-94991d3e3ddb
