  /projects:
    get:
      tags:
      - API Endpoints
      summary: List projects
      description: 'List projects accessible to the authenticated user within a drive.


        The drive is determined from the access token.


        Results are paginated. Use the `cursor` from the response `pagination.next_cursor`

        to fetch subsequent pages.

        '
      operationId: listProjects
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: name
        description: Filter projects whose name contains this string (case-insensitive).
        required: false
        schema:
          type: string
      - in: query
        name: folder_path
        description: Filter projects by folder path (e.g. "Clients/Acme/Videos"). Use "/" to separate nested folders. Returns only projects directly inside the deepest folder.
        required: false
        schema:
          type: string
      - in: query
        name: created_by
        description: Filter projects created by this user UUID. Pass `me` to filter by the authenticated user.
        required: false
        schema:
          type: string
      - in: query
        name: created_after
        description: Filter projects created after this ISO 8601 timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        description: Filter projects created before this ISO 8601 timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_after
        description: Filter projects updated after this ISO 8601 timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_before
        description: Filter projects updated before this ISO 8601 timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: sort
        description: Sort field. Defaults to created_at.
        required: false
        schema:
          type: string
          enum:
          - name
          - created_at
          - updated_at
          - last_viewed_at
          default: created_at
      - in: query
        name: direction
        description: Sort direction. Defaults to desc.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - in: query
        name: cursor
        description: Pagination cursor from a previous response's `pagination.next_cursor`.
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: Number of projects per page (1-100). Defaults to 20.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Projects listed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - created_at
                      - updated_at
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Project ID
                          example: 9f36ee32-5a2c-47e7-b1a3-94991d3e3ddb
                        name:
                          type: string
                          description: Project name
                          example: Marketing Video
                        created_at:
                          type: string
                          format: date-time
                          description: When the project was created
                          example: '2025-11-18T10:30:00Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: When the project was last updated
                          example: '2025-11-19T14:00:00Z'
                  pagination:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        description: Cursor for the next page. Absent if no more results.
        '401':
          description: Unauthorized - invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '429':
          $ref: '#/components/responses/Error429Response'
  /projects/{project_id}:
    get:
      tags:
      - API Endpoints
      summary: Get project details
      description: 'Get a detailed project summary including all media files and compositions.


        Returns the project''s id, name, drive_id, a map of media files (keyed by

        display path) with type and duration, and a list of compositions with id,

        name, duration, and media type.


        Use this to inspect a project''s contents before editing or importing media.

        '
      operationId: getProject
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: project_id
        description: The project UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Project details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - drive_id
                - created_at
                - updated_at
                - media_files
                - compositions
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Project ID
                  name:
                    type: string
                    description: Project name
                  drive_id:
                    type: string
                    format: uuid
                    description: Drive ID the project belongs to
                  created_at:
                    type: string
                    format: date-time
                    description: When the project was created (ISO 8601)
                  updated_at:
                    type: string
                    format: date-time
                    description: When the project was last updated (ISO 8601)
                  media_files:
                    type: object
                    description: Map of display path to media file info
                    additionalProperties:
                      type: object
                      required:
                      - type
                      properties:
                        type:
                          type: string
                          enum:
                          - audio
                          - video
                          - image
                          - sequence
                          - other
                          description: Media type
                        duration:
                          type: number
                          format: float
                          description: Duration in seconds (absent for images)
                  compositions:
                    type: array
                    description: Compositions in the project
                    items:
                      type: object
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Composition ID
                        name:
                          type: string
                          description: Composition name
                        duration:
                          type: number
                          format: float
                          description: Duration in seconds
                        media_type:
                          type: string
                          description: Media type of the composition
        '401':
          description: Unauthorized - invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - user does not have access to this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '429':
          $ref: '#/components/responses/Error429Response'
  /status:
    get:
      tags:
      - API Endpoints
      summary: Check API status
      security:
      - bearerAuth: []
      description: '> **Work in progress** — This endpoint is not yet available and will return an error if called.


        Check API availability and validate authentication token.


        This endpoint can be used to:

        - Verify that your authentication token is valid

        - Check API connectivity without performing any heavy operations


        Returns a success response if the token is valid, or a 401 error if the token is invalid or missing.

        '
      operationId: getStatus
      responses:
        '200':
          description: Token is valid and API is available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    description: API status indicator
                    example: ok
                required:
                - status
              examples:
                success:
                  summary: Successful status check
                  value:
                    status: ok
        '401':
          description: Unauthorized - missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
              examples:
                unauthorized:
                  summary: Missing authentication token
                  value:
                    error: unauthorized
                    message: Missing or invalid authentication token
components:
  schemas:
    AgentErrorResult:
      type: object
      title: AgentErrorResult
      description: Result when Agent edit failed
      properties:
        status:
          type: string
          enum:
          - error
          description: Indicates the job failed
          example: error
        error_message:
          type: string
          description: Human-readable error message
          example: AI agent failed to process the request
        error_code:
          type: string
          description: Machine-readable error code
          example: agent_execution_failed
      required:
      - status
      - error_message
    PublishSuccessResult:
      type: object
      description: Result when publish completed successfully
      properties:
        status:
          type: string
          enum:
          - success
          description: Indicates successful completion
        composition_id:
          type: string
          description: Identifier of the published composition
          example: 39677a40-1c43-4c36-8449-46cfbc4de2b5
        share_url:
          type: string
          format: uri
          description: Public URL to view the published content
          example: https://share.descript.com/view/abc123
        download_url:
          type: string
          format: uri
          description: 'Time-limited signed URL to download the original published media file. Present when the job completed successfully and signing succeeded.

            '
          example: https://storage.googleapis.com/bucket/object?X-Goog-Signature=...
        download_url_expires_at:
          type: string
          format: date-time
          description: ISO 8601 time when download_url expires (if download_url is set)
      required:
      - status
      - composition_id
      - share_url
    Error429:
      description: 'Rate limit exceeded response. When this error is returned, the response includes headers

        to help you implement proper retry logic:

        - `Retry-After`: Number of seconds to wait before retrying

        - `X-RateLimit-Remaining`: Requests remaining in current window

        - `X-RateLimit-Consumed`: Requests consumed in current window

        '
      type: object
      properties:
        error:
          type: string
          description: Error code indicating rate limit was exceeded
          example: rate_limit_exceeded
        message:
          type: string
          description: Human-readable error message
          example: Too many requests
      required:
      - error
      - message
    ImportErrorResult:
      type: object
      title: ImportErrorResult
      description: Result when job failed completely
      properties:
        status:
          type: string
          enum:
          - error
          description: Job failed completely
          example: error
        error_message:
          type: string
          description: Human-readable error message
          example: Failed to import media files
        error_code:
          type: string
          description: Machine-readable error code
          example: import_failed
      required:
      - status
      - error_message
    AgentSuccessResult:
      type: object
      title: AgentSuccessResult
      description: Result when Agent edit completed successfully
      properties:
        status:
          type: string
          enum:
          - success
          description: Indicates successful completion
          example: success
        agent_response:
          type: string
          description: AI response describing what was done
          example: I added Studio Sound to all 3 clips in your composition
        project_changed:
          type: boolean
          description: Whether the agent made modifications to the project
          example: true
        media_seconds_used:
          type: integer
          description: Media minutes (in seconds) consumed by this operation
          example: 34
        ai_credits_used:
          type: integer
          description: AI credits consumed by this operation
          example: 5
      required:
      - status
      - agent_response
      - project_changed
    PublishErrorResult:
      type: object
      description: Result when publish failed
      properties:
        status:
          type: string
          enum:
          - error
          description: Indicates the publish job failed
        error_message:
          type: string
          description: Human-readable error message
          example: Export failed during render
      required:
      - status
      - error_message
    PublishJobStatus:
      type: object
      description: Status of a publish job
      properties:
        job_id:
          type: string
          format: uuid
          description: Unique identifier for the job
          example: 6dc3f30a-58c2-4174-96a6-dc18cf3c7776
        job_type:
          type: string
          enum:
          - publish
          description: Type of job
        job_state:
          type: string
          enum:
          - queued
          - running
          - stopped
          - cancelled
          description: 'Current state of the job:

            - queued: Job is waiting to start

            - running: Job is actively processing

            - stopped: Job has finished (check result.status for outcome)

            - cancelled: Job was cancelled by user

            '
          example: stopped
        created_at:
          type: string
          format: date-time
          description: When the job was created
          example: '2025-11-18T10:30:00Z'
        stopped_at:
          type: string
          format: date-time
          description: When the job stopped (only present when job_state is stopped or cancelled)
          example: '2025-11-18T10:35:00Z'
        drive_id:
          type: string
          format: uuid
          description: The drive ID
          example: c9c5c47e-158a-49f7-846b-4f6ee2a229a2
        project_id:
          type: string
          format: uuid
          description: The project ID
          example: 9f36ee32-5a2c-47e7-b1a3-94991d3e3ddb
        project_url:
          type: string
          format: uri
          description: URL to access the project in Descript web app
          example: https://web.descript.com/9f36ee32-5a2c-47e7-b1a3-94991d3e3ddb
        progress:
          type: object
          description: Progress information for the workflow (only present when job_state is running)
          properties:
            label:
              type: string
              description: Human-readable label describing the current action
              example: Exporting composition...
            percent:
              type: integer
              description: Percentage of the workflow that has been completed
              example: 50
            last_update_at:
              type: string
              format: date-time
              description: When the progress was last updated
              example: '2025-11-18T10:32:00Z'
            composition_id:
              type: string
              description: Composition being published (present when known)
              example: 39677a40-1c43-4c36-8449-46cfbc4de2b5
            share_url:
              type: string
              format: uri
              description: Share URL when available before the job completes
              example: https://share.descript.com/view/abc123
          required:
          - label
        result:
          description: Job result (only present when job_state is stopped)
          oneOf:
          - $ref: '#/components/schemas/PublishSuccessResult'
          - $ref: '#/components/schemas/PublishErrorResult'
          discriminator:
            propertyName: status
            mapping:
              success: '#/components/schemas/PublishSuccessResult'
              error: '#/components/schemas/PublishErrorResult'
      required:
      - job_id
      - job_type
      - job_state
      - created_at
      - drive_id
      - project_id
      - project_url
    ImportJobStatus:
      type: object
      description: Status of an import job
