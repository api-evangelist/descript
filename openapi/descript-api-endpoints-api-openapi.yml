                - drive_id
                - project_id
                - project_url
        '400':
          description: 'Invalid input:

            - Malformed request body

            - Invalid project_id or composition_id format

            - Invalid media_type or resolution value

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
              examples:
                invalid_project:
